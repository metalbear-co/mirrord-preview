name: 'Install mirrord'
description: >-
  Installs the mirrord CLI through metalbear-co/setup-mirrord. Kept so workflows that reference
  metalbear-co/mirrord-preview/install keep working; new workflows use setup-mirrord directly.
branding:
  icon: 'download'
  color: 'purple'

inputs:
  version:
    description: 'mirrord version to install, e.g. 3.250.0. Defaults to the latest release.'
    required: false
  checksum:
    description: 'Expected SHA-256 of the release asset for this runner; a mismatch fails the step.'
    required: false

outputs:
  version:
    description: 'The mirrord version this action resolved and installed'
    value: ${{ steps.setup.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Install mirrord CLI
      id: setup
      uses: metalbear-co/setup-mirrord@v1
      with:
        version: ${{ inputs.version }}
        checksum: ${{ inputs.checksum }}
